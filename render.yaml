services:
  - type: web
    name: st-silas-school-management
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/system/health
    disk:
      name: st-silas-school-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: st-silas-postgres
          property: connectionString
      - key: SQLITE_FILE_PATH
        value: /var/data/st_silas.sqlite
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: st-silas-postgres
    databaseName: st_silas_db
    user: st_silas_user
    plan: free
